<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Stackly</title>
    <meta name="description" content="Sign in to your Stackly account." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lime: {
                DEFAULT: "#63fd02",
                400: "#8bff3d",
                500: "#63fd02",
                600: "#4fd100",
                700: "#3b9c00",
              },
              ink: {
                DEFAULT: "#010101",
                900: "#050505",
                800: "#0a0a0a",
                700: "#111111",
                600: "#1a1a1a",
              },
              snow: "#fbfcfc",
              fire: "#ff5722",
            },
            fontFamily: {
              display: ['"Space Grotesk"', "system-ui", "sans-serif"],
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            maxWidth: { "8xl": "90rem" },
          },
        },
      };
    </script>

    <style>
      :root {
        --lime: #63fd02;
        --lime-hi: #8bff3d;
        --lime-lo: #4fd100;
        --ink: #010101;
        --red: #ff4d4d;
        --chamfer: 16px;
      }
      @media (min-width: 640px) {
        :root {
          --chamfer: 22px;
        }
      }
      @media (min-width: 1024px) {
        :root {
          --chamfer: 26px;
        }
      }

      *,
      *::before,
      *::after {
        border-radius: 0 !important;
        box-sizing: border-box;
      }

      /* ═══════════════════════════════════════════════════════ */
      /* GLOBAL OVERFLOW GUARD — prevents horizontal scroll      */
      /* ═══════════════════════════════════════════════════════ */
      html,
      body {
        height: 100%;
        max-width: 100%;
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        background:
          radial-gradient(
            1200px 600px at 50% -10%,
            rgba(99, 253, 2, 0.06),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 100% 40%,
            rgba(99, 253, 2, 0.03),
            transparent 65%
          ),
          linear-gradient(180deg, #010101 0%, #050505 60%, #010101 100%);
        background-attachment: fixed;
        color: #fbfcfc;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::selection {
        background: var(--lime);
        color: var(--ink);
      }

      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 9999;
        background: linear-gradient(
          90deg,
          var(--lime) 0%,
          var(--lime-hi) 50%,
          var(--lime) 100%
        );
        transform-origin: 0% 50%;
        transform: scaleX(0);
        box-shadow:
          0 0 14px rgba(99, 253, 2, 0.7),
          0 0 30px rgba(99, 253, 2, 0.4);
        pointer-events: none;
      }

      /* BUTTONS */
      .btn-tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.95rem 1.6rem;
        font-weight: 700;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        cursor: pointer;
        isolation: isolate;
        overflow: hidden;
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
        transition:
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.35s ease,
          color 0.45s ease 0.08s,
          text-shadow 0.45s ease 0.08s;
        will-change: transform;
      }
      @media (min-width: 640px) {
        .btn-tab {
          padding: 1.05rem 2rem;
          font-size: 0.85rem;
        }
      }
      .btn-tab:hover {
        transform: translateY(-2px);
      }
      .btn-tab:active {
        transform: translateY(0);
      }

      .btn-tab::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        transform: scaleX(0);
        transform-origin: 50% 50%;
        transition: transform 0.55s cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform;
      }

      .btn-tab--lime {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 45%,
          var(--lime-lo) 100%
        );
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 -2px 0 rgba(0, 0, 0, 0.18);
        filter: drop-shadow(0 8px 18px rgba(99, 253, 2, 0.35));
      }
      .btn-tab--lime::before {
        background: linear-gradient(
          180deg,
          #1e1e1e 0%,
          #0a0a0a 55%,
          #020202 100%
        );
      }
      .btn-tab--lime:hover {
        color: var(--lime);
        text-shadow: 0 0 14px rgba(99, 253, 2, 0.55);
        filter: drop-shadow(0 12px 26px rgba(99, 253, 2, 0.55));
      }
      .btn-tab--lime:hover::before {
        transform: scaleX(1);
      }

      .btn-tab--dark {
        background: linear-gradient(
          180deg,
          #2b2b2b 0%,
          #181818 50%,
          #0d0d0d 100%
        );
        color: #fbfcfc;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -2px 0 rgba(0, 0, 0, 0.7);
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.6));
      }
      .btn-tab--dark::before {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
      }
      .btn-tab--dark:hover {
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        filter: drop-shadow(0 12px 26px rgba(99, 253, 2, 0.5));
      }
      .btn-tab--dark:hover::before {
        transform: scaleX(1);
      }
      .btn-tab--dark:hover .arrow {
        transform: translateX(3px);
      }
      .btn-tab .arrow {
        transition: transform 0.3s ease;
      }

      .btn-tab--ghost {
        background: rgba(10, 10, 10, 0.55);
        color: #fbfcfc;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        border-left: 1px solid rgba(255, 255, 255, 0.06);
        border-right: 1px solid rgba(0, 0, 0, 0.6);
        border-bottom: 1px solid rgba(0, 0, 0, 0.85);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 12px 30px -14px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      .btn-tab--ghost::before {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
      }
      .btn-tab--ghost:hover {
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        border-top-color: rgba(99, 253, 2, 0.55);
      }
      .btn-tab--ghost:hover::before {
        transform: scaleX(1);
      }

      .btn-tab--full {
        width: 100%;
      }

      .sk-tag {
        display: inline-block;
        padding: 0.5rem 1rem 0.5rem calc(var(--chamfer) + 0.3rem);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #1e1e1e 0%, #0d0d0d 100%);
        color: var(--lime);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        border-bottom: 1px solid rgba(0, 0, 0, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 6px 14px -8px rgba(0, 0, 0, 0.9);
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
      }
      .sk-tag::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 0.6rem;
        background: var(--lime);
        vertical-align: middle;
        box-shadow: 0 0 10px var(--lime);
        transform: translateY(-1px);
      }

      .word {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding-bottom: 0.14em;
        margin-bottom: -0.14em;
      }
      .word-inner {
        display: inline-block;
        will-change: transform;
      }

      /* ═══════════════════════════════════════════════════════ */
      /* PAGE LAYOUT                                             */
      /* ═══════════════════════════════════════════════════════ */
      .auth-page {
        position: relative;
        min-height: 100svh;
        width: 100%;
        max-width: 100%;
        display: flex;
        align-items: center;
        padding: 2rem 0;
        overflow-x: hidden;
        overflow-x: clip; /* fallback for modern browsers */
      }
      @supports (overflow: clip) {
        .auth-page {
          overflow-x: clip;
          overflow-y: visible;
        }
      }
      @media (min-width: 768px) {
        .auth-page {
          padding: 3rem 0;
        }
      }

      .auth-bloom {
        position: absolute;
        top: -160px;
        left: 50%;
        transform: translateX(-50%);
        /* 160vw was the main culprit for horizontal overflow */
        width: min(900px, 100vw);
        max-width: 100%;
        height: 520px;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(99, 253, 2, 0.18),
          transparent 65%
        );
        filter: blur(70px);
        will-change: transform, opacity;
      }
      .auth-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.28;
        z-index: 0;
        background-image:
          linear-gradient(rgba(251, 252, 252, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(251, 252, 252, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(
          ellipse 80% 70% at 50% 30%,
          #000 20%,
          transparent 80%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 80% 70% at 50% 30%,
          #000 20%,
          transparent 80%
        );
      }

      .auth-shell {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, #131313 0%, #080808 100%);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-left: 1px solid rgba(255, 255, 255, 0.04);
        border-right: 1px solid rgba(0, 0, 0, 0.9);
        border-bottom: 1px solid rgba(0, 0, 0, 0.98);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 50px 110px -50px rgba(0, 0, 0, 0.95);
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
        isolation: isolate;
      }
      .auth-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.4;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 3px
        );
        z-index: 1;
      }

      /* ═══════════════════════════════════════════════════════ */
      /* LEFT PANEL — FULL IMAGE + GO HOME BUTTON                */
      /* ═══════════════════════════════════════════════════════ */
      .auth-aside {
        position: relative;
        z-index: 2;
        padding: 0;
        overflow: hidden;
        background: #0a0a0a;
        min-height: 280px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      @media (min-width: 640px) {
        .auth-aside {
          min-height: 340px;
        }
      }
      @media (min-width: 1024px) {
        .auth-aside {
          min-height: 100%;
          border-bottom: 0;
          border-right: 1px solid rgba(255, 255, 255, 0.06);
        }
      }

      /* Background image — full bleed, clearly visible */
      .auth-aside-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        z-index: 0;
        display: block;
        filter: contrast(1.04) saturate(1.06);
        transform: scale(1.02);
        transition:
          transform 1.6s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.6s ease;
        will-change: transform;
      }
      .auth-aside:hover .auth-aside-bg {
        transform: scale(1.06);
        filter: contrast(1.06) saturate(1.1);
      }

      /* Very light vignette only — keeps image clearly visible */
      .auth-aside-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(
            140% 110% at 50% 50%,
            transparent 45%,
            rgba(1, 1, 1, 0.35) 100%
          ),
          linear-gradient(
            135deg,
            rgba(1, 1, 1, 0.55) 0%,
            rgba(1, 1, 1, 0.15) 32%,
            transparent 55%
          );
      }

      /* Fallback colour if image fails */
      .auth-aside-fallback {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(
            120% 100% at 0% 0%,
            rgba(99, 253, 2, 0.22),
            transparent 55%
          ),
          linear-gradient(180deg, #121212 0%, #050505 100%);
      }

      /* Inner wrapper — holds the button, anchored top-left */
      .auth-aside-inner {
        position: relative;
        z-index: 3;
        height: 100%;
        min-height: inherit;
        padding: 1.4rem;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
      }
      @media (min-width: 640px) {
        .auth-aside-inner {
          padding: 1.8rem;
        }
      }
      @media (min-width: 1024px) {
        .auth-aside-inner {
          padding: 2.2rem 2rem;
        }
      }

      /* RIGHT — form panel */
      .auth-main {
        position: relative;
        z-index: 2;
        padding: 2rem 1.5rem;
        min-width: 0; /* prevents content from forcing the grid wider */
      }
      @media (min-width: 640px) {
        .auth-main {
          padding: 2.6rem 2.2rem;
        }
      }
      @media (min-width: 1024px) {
        .auth-main {
          padding: 3.2rem 3rem;
        }
      }

      .form-field {
        position: relative;
        margin-bottom: 1.1rem;
        min-width: 0;
      }
      .form-label-s {
        display: block;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(251, 252, 252, 0.5);
        margin-bottom: 0.5rem;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
      }
      .form-label-s .req {
        color: var(--red);
        margin-left: 0.15rem;
      }

      .form-input {
        display: block;
        width: 100%;
        max-width: 100%;
        padding: 0.9rem 1rem;
        font-family: inherit;
        font-size: 0.92rem;
        color: #fbfcfc;
        background: linear-gradient(180deg, #050505 0%, #0d0d0d 100%);
        border-top: 1px solid #000;
        border-left: 1px solid #000;
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow:
          inset 0 2px 5px rgba(0, 0, 0, 0.9),
          inset 0 -1px 0 rgba(255, 255, 255, 0.03);
        outline: none;
        transition:
          border-color 0.22s ease,
          box-shadow 0.22s ease,
          background 0.22s ease;
      }
      .form-input::placeholder {
        color: rgba(251, 252, 252, 0.24);
      }
      .form-input:hover {
        border-bottom-color: rgba(255, 255, 255, 0.12);
      }
      .form-input:focus {
        background: linear-gradient(180deg, #030303 0%, #0a0a0a 100%);
        border-top-color: rgba(99, 253, 2, 0.4);
        border-left-color: rgba(99, 253, 2, 0.3);
        border-bottom-color: rgba(99, 253, 2, 0.5);
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.95),
          0 0 0 1px rgba(99, 253, 2, 0.18),
          0 0 24px -8px rgba(99, 253, 2, 0.4);
      }

      .pw-wrap {
        position: relative;
        display: block;
      }
      .pw-wrap .form-input {
        padding-right: 3.2rem;
      }
      .pw-toggle {
        position: absolute;
        right: 0.55rem;
        top: 50%;
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        border-bottom: 1px solid rgba(0, 0, 0, 0.9);
        color: rgba(251, 252, 252, 0.55);
        cursor: pointer;
        transition:
          color 0.25s ease,
          background 0.25s ease,
          border-color 0.25s ease;
      }
      .pw-toggle:hover {
        color: var(--lime);
        border-top-color: rgba(99, 253, 2, 0.35);
      }

      /* Role selector */
      .role-group {
        display: grid;
        /* minmax(0,1fr) is the critical fix — plain 1fr forces a min-content
           floor which the nowrap role text was blowing past */
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.7rem;
        min-width: 0;
      }
      .role-option {
        position: relative;
        display: block;
        cursor: pointer;
        min-width: 0;
      }
      .role-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .role-inner {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 1rem;
        min-width: 0;
        overflow: hidden;
        background: linear-gradient(180deg, #121212 0%, #080808 100%);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-left: 1px solid rgba(255, 255, 255, 0.03);
        border-right: 1px solid rgba(0, 0, 0, 0.85);
        border-bottom: 1px solid rgba(0, 0, 0, 0.95);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
        transition:
          border-color 0.3s ease,
          box-shadow 0.35s ease,
          transform 0.3s ease,
          background 0.3s ease;
        isolation: isolate;
      }
      .role-inner::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          180deg,
          rgba(99, 253, 2, 0.1),
          rgba(99, 253, 2, 0.04)
        );
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      .role-option:hover .role-inner {
        transform: translateY(-2px);
        border-top-color: rgba(99, 253, 2, 0.3);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 20px 40px -22px rgba(99, 253, 2, 0.35);
      }
      .role-option input:checked + .role-inner {
        border-top-color: rgba(99, 253, 2, 0.55);
        border-left-color: rgba(99, 253, 2, 0.35);
        border-bottom-color: rgba(99, 253, 2, 0.55);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 0 0 1px rgba(99, 253, 2, 0.2),
          0 24px 50px -24px rgba(99, 253, 2, 0.45);
        background: linear-gradient(180deg, #161616 0%, #0a0a0a 100%);
      }
      .role-option input:checked + .role-inner::before {
        opacity: 1;
      }

      .role-icon {
        flex: none;
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        background: linear-gradient(180deg, #1f1f1f 0%, #0d0d0d 100%);
        border-top: 1px solid rgba(99, 253, 2, 0.3);
        border-bottom: 1px solid rgba(0, 0, 0, 0.9);
        color: var(--lime);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }
      .role-option input:checked + .role-inner .role-icon {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
        color: var(--ink);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 -2px 0 rgba(0, 0, 0, 0.2),
          0 0 14px -2px rgba(99, 253, 2, 0.6);
      }

      .role-text {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }
      .role-name {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
        color: #fbfcfc;
        text-transform: uppercase;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .role-desc {
        display: block;
        font-size: 0.68rem;
        color: rgba(251, 252, 252, 0.45);
        margin-top: 0.25rem;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (min-width: 640px) {
        .role-desc {
          white-space: normal;
          overflow: visible;
        }
      }
      /* very small phones — tighten the role cards so they fit */
      @media (max-width: 400px) {
        .role-inner {
          padding: 0.85rem 0.7rem;
          gap: 0.5rem;
        }
        .role-icon {
          width: 28px;
          height: 28px;
        }
        .role-name {
          font-size: 0.78rem;
        }
      }

      /* remember + links */
      .form-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        margin-top: 0.4rem;
      }
      .check-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        user-select: none;
        font-size: 0.82rem;
        color: rgba(251, 252, 252, 0.55);
        transition: color 0.25s ease;
      }
      .check-wrap:hover {
        color: rgba(251, 252, 252, 0.8);
      }

      .sk-check {
        appearance: none;
        width: 18px;
        height: 18px;
        flex: none;
        background: linear-gradient(180deg, #050505 0%, #0d0d0d 100%);
        border-top: 1px solid #000;
        border-left: 1px solid #000;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9);
        cursor: pointer;
        position: relative;
        transition:
          background 0.2s ease,
          box-shadow 0.2s ease;
      }
      .sk-check:checked {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 -2px 0 rgba(0, 0, 0, 0.2),
          0 0 14px -2px rgba(99, 253, 2, 0.6);
      }
      .sk-check:checked::after {
        content: "";
        position: absolute;
        left: 5px;
        top: 1px;
        width: 5px;
        height: 10px;
        border: solid var(--ink);
        border-width: 0 2.5px 2.5px 0;
        transform: rotate(45deg);
      }

      .link-lime {
        font-size: 0.82rem;
        color: var(--lime);
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid transparent;
        transition:
          border-color 0.25s ease,
          color 0.25s ease;
      }
      .link-lime:hover {
        border-bottom-color: var(--lime);
        text-shadow: 0 0 12px rgba(99, 253, 2, 0.5);
      }

      /* Error states */
      .field-error {
        display: block;
        font-size: 0.74rem;
        font-weight: 500;
        color: var(--red);
        margin-top: 0.42rem;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          max-height 0.28s ease,
          opacity 0.28s ease;
        text-shadow: 0 0 12px rgba(255, 77, 77, 0.25);
      }
      .form-field.has-error .form-input {
        border-top-color: rgba(255, 77, 77, 0.75);
        border-left-color: rgba(255, 77, 77, 0.6);
        border-bottom-color: rgba(255, 77, 77, 0.75);
        background: linear-gradient(180deg, #0d0303 0%, #140505 100%);
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.95),
          0 0 0 1px rgba(255, 77, 77, 0.22),
          0 0 24px -8px rgba(255, 77, 77, 0.4);
      }
      .form-field.has-error .field-error {
        max-height: 44px;
        opacity: 1;
      }
      .form-field.has-error .form-label-s {
        color: rgba(255, 77, 77, 0.9);
      }
      .form-field.shake {
        animation: fieldShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }
      @keyframes fieldShake {
        10%,
        90% {
          transform: translateX(-1px);
        }
        20%,
        80% {
          transform: translateX(2px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-4px);
        }
        40%,
        60% {
          transform: translateX(4px);
        }
      }

      .role-group.has-error {
        box-shadow: 0 0 0 1px rgba(255, 77, 77, 0.35);
        padding: 0.55rem;
        background: rgba(255, 77, 77, 0.04);
      }
      .role-error {
        display: block;
        font-size: 0.74rem;
        font-weight: 500;
        color: var(--red);
        margin-top: 0.6rem;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          max-height 0.28s ease,
          opacity 0.28s ease;
        text-shadow: 0 0 12px rgba(255, 77, 77, 0.25);
      }
      .role-error.is-visible {
        max-height: 44px;
        opacity: 1;
      }

      .form-note {
        font-size: 0.75rem;
        color: rgba(251, 252, 252, 0.35);
        text-align: center;
        margin-top: 1.4rem;
        line-height: 1.6;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        margin: 1.6rem 0 1.3rem;
        font-size: 0.68rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(251, 252, 252, 0.3);
        font-weight: 600;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
      }

      .form-head {
        margin-bottom: 1.6rem;
      }
      .form-title {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: #fbfcfc;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
        margin-top: 0.85rem;
      }
      @media (min-width: 640px) {
        .form-title {
          font-size: 1.85rem;
        }
      }
      @media (min-width: 1024px) {
        .form-title {
          font-size: 2.05rem;
        }
      }

      .form-sub {
        font-size: 0.88rem;
        color: rgba(251, 252, 252, 0.5);
        line-height: 1.6;
        margin-top: 0.6rem;
      }

      .shell {
        max-width: 90rem;
        width: 100%;
        margin-inline: auto;
        padding-inline: 1.15rem;
      }
      @media (min-width: 640px) {
        .shell {
          padding-inline: 2rem;
        }
      }

      h1,
      h2,
      h3,
      h4,
      h5 {
        font-family: "Space Grotesk", sans-serif;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
        .btn-tab::before {
          transition: transform 0.01ms;
        }
      }
    </style>
  </head>

  <body>
    <div class="scroll-progress" aria-hidden="true"></div>

    <main class="auth-page">
      <div class="auth-bloom" aria-hidden="true"></div>
      <div class="auth-grid" aria-hidden="true"></div>

      <div class="shell relative w-full">
        <div class="auth-shell auth-shell-el">
          <div class="grid lg:grid-cols-[1fr_1fr]">
            <!-- ═══ LEFT — FULL IMAGE + GO HOME BUTTON ═══ -->
            <aside class="auth-aside">
              <!-- Fallback background (visible if image fails) -->
              <div class="auth-aside-fallback" aria-hidden="true"></div>

              <!-- Background image -->
              <img
                class="auth-aside-bg"
                src="./assets/login.webp"
                alt=""
                loading="eager"
              />

              <!-- Light overlay for edge vignette + button readability -->
              <div class="auth-aside-overlay" aria-hidden="true"></div>

              <!-- Home button -->
              <div class="auth-aside-inner">
                <a href="index.html" class="btn-tab btn-tab--ghost">
                  <svg
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                  </svg>
                  Go to home
                </a>
              </div>
            </aside>

            <!-- ═══ RIGHT — LOGIN FORM ═══ -->
            <div class="auth-main">
              <div class="form-head">
                <span class="sk-tag">Account access</span>
                <h2 class="form-title">Sign in</h2>
                <p class="form-sub">
                  Enter any email and password to continue — this demo accepts
                  all credentials.
                </p>
              </div>

              <form id="loginForm" novalidate autocomplete="on">
                <!-- Email -->
                <div class="form-field" id="fieldEmail">
                  <label class="form-label-s" for="email"
                    >Email address <span class="req">*</span></label
                  >
                  <input
                    class="form-input"
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@company.com"
                    autocomplete="email"
                    data-validate
                    data-required-msg="Please enter your email address"
                  />
                  <span class="field-error" aria-live="polite"></span>
                </div>

                <!-- Password -->
                <div class="form-field" id="fieldPassword">
                  <label class="form-label-s" for="password"
                    >Password <span class="req">*</span></label
                  >
                  <div class="pw-wrap">
                    <input
                      class="form-input"
                      type="password"
                      id="password"
                      name="password"
                      placeholder="Enter any password"
                      autocomplete="current-password"
                      data-validate
                      data-required-msg="Please enter your password"
                    />
                    <button
                      type="button"
                      class="pw-toggle"
                      id="pwToggle"
                      aria-label="Show password"
                    >
                      <svg
                        id="pwIconShow"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.9"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path
                          d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        />
                        <circle cx="12" cy="12" r="3" />
                      </svg>
                      <svg
                        id="pwIconHide"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.9"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        style="display: none"
                      >
                        <path
                          d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"
                        />
                        <path d="M1 1l22 22" />
                        <path d="M14.12 14.12a3 3 0 11-4.24-4.24" />
                      </svg>
                    </button>
                  </div>
                  <span class="field-error" aria-live="polite"></span>
                </div>

                <!-- Role selector -->
                <div
                  class="form-field"
                  id="fieldRole"
                  style="margin-top: 1.4rem"
                >
                  <label class="form-label-s"
                    >Select your role <span class="req">*</span></label
                  >

                  <div
                    class="role-group"
                    id="roleGroup"
                    role="radiogroup"
                    aria-label="Select role"
                  >
                    <label class="role-option">
                      <input type="radio" name="role" value="admin" data-role />
                      <span class="role-inner">
                        <span class="role-icon">
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path
                              d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
                            />
                          </svg>
                        </span>
                        <span class="role-text">
                          <span class="role-name">Admin</span>
                          <span class="role-desc">Full access & controls</span>
                        </span>
                      </span>
                    </label>

                    <label class="role-option">
                      <input type="radio" name="role" value="user" data-role />
                      <span class="role-inner">
                        <span class="role-icon">
                          <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                          </svg>
                        </span>
                        <span class="role-text">
                          <span class="role-name">User</span>
                          <span class="role-desc">Standard access</span>
                        </span>
                      </span>
                    </label>
                  </div>

                  <span
                    class="role-error"
                    id="roleError"
                    aria-live="polite"
                  ></span>
                </div>

                <!-- Remember + Forgot -->
                <div class="form-row">
                  <label class="check-wrap">
                    <input
                      type="checkbox"
                      class="sk-check"
                      id="remember"
                      name="remember"
                      checked
                    />
                    <span>Remember me</span>
                  </label>
                  <a href="./404.html" class="link-lime">Forgot password?</a>
                </div>

                <!-- Submit -->
                <div style="margin-top: 1.6rem">
                  <button
                    type="submit"
                    class="btn-tab btn-tab--lime btn-tab--full"
                  >
                    Sign in
                    <svg
                      class="arrow"
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M5 12h14M13 6l6 6-6 6" />
                    </svg>
                  </button>
                </div>

                <!-- Divider -->
                <div class="divider">New to Stackly?</div>

                <!-- Signup link -->
                <a
                  href="./signup.html"
                  class="btn-tab btn-tab--dark btn-tab--full"
                >
                  Create an account
                  <svg
                    class="arrow"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </a>

                <p class="form-note">
                  By continuing you agree to Stackly's
                  <a href="./404.html" class="link-lime">Terms</a> and
                  <a href="./404.html" class="link-lime">Privacy Policy</a>.
                </p>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
      (function () {
        "use strict";

        /* WORD SPLITTER */
        function splitText(el) {
          const nodes = Array.from(el.childNodes);
          const frag = document.createDocumentFragment();
          function makeWord(text) {
            const w = document.createElement("span");
            w.className = "word";
            const inner = document.createElement("span");
            inner.className = "word-inner";
            inner.textContent = text;
            w.appendChild(inner);
            return w;
          }
          function pushText(text, target) {
            text.split(/(\s+)/).forEach((p) => {
              if (p.trim() === "")
                target.appendChild(document.createTextNode(p));
              else target.appendChild(makeWord(p));
            });
          }
          function wrapElement(src, target) {
            const clone = src.cloneNode(false);
            Array.from(src.childNodes).forEach((child) => {
              if (child.nodeType === 3) pushText(child.textContent, clone);
              else if (child.nodeType === 1 && child.tagName !== "BR")
                clone.appendChild(child.cloneNode(true));
              else if (child.nodeType === 1)
                clone.appendChild(child.cloneNode());
            });
            target.appendChild(clone);
          }
          nodes.forEach((node) => {
            if (node.nodeType === 3) pushText(node.textContent, frag);
            else if (node.nodeType === 1) {
              if (node.tagName === "BR") frag.appendChild(node.cloneNode());
              else wrapElement(node, frag);
            }
          });
          el.innerHTML = "";
          el.appendChild(frag);
          return el.querySelectorAll(".word-inner");
        }

        if (window.gsap && window.ScrollTrigger)
          gsap.registerPlugin(ScrollTrigger);
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        /* Scroll progress bar */
        const progressBar = document.querySelector(".scroll-progress");
        if (progressBar && !reduceMotion) {
          gsap.to(progressBar, {
            scaleX: 1,
            ease: "none",
            scrollTrigger: {
              trigger: document.documentElement,
              start: "top top",
              end: "bottom bottom",
              scrub: 0.2,
            },
          });
        }

        /* Page entrance */
        const formTitle = document.querySelector(".form-title");
        let formWords = [];
        if (formTitle) {
          formWords = splitText(formTitle);
          gsap.set(formWords, { yPercent: 115 });
        }

        if (!reduceMotion) {
          const tl = gsap.timeline({
            delay: 0.2,
            defaults: { ease: "power4.out" },
          });

          /* Shell clip reveal */
          tl.fromTo(
            ".auth-shell-el",
            { clipPath: "inset(0 0 100% 0)", y: 40, opacity: 0 },
            { clipPath: "inset(0 0 0% 0)", y: 0, opacity: 1, duration: 1.15 },
          );

          /* Left panel — image + button */
          tl.from(
            ".auth-aside-bg",
            { scale: 1.14, opacity: 0, duration: 1.3 },
            "-=0.85",
          ).from(
            ".auth-aside .btn-tab",
            { y: 18, opacity: 0, duration: 0.7 },
            "-=0.85",
          );

          /* Right panel */
          tl.from(
            ".form-head .sk-tag",
            { x: -20, opacity: 0, duration: 0.55 },
            "-=0.55",
          )
            .to(
              formWords,
              { yPercent: 0, duration: 0.85, stagger: 0.05 },
              "-=0.5",
            )
            .from(".form-sub", { y: 18, opacity: 0, duration: 0.6 }, "-=0.5")
            .from(
              ".auth-main .form-field",
              { y: 22, opacity: 0, duration: 0.6, stagger: 0.09 },
              "-=0.4",
            )
            .from(".form-row", { y: 16, opacity: 0, duration: 0.5 }, "-=0.3")
            .from(
              ".auth-main .btn-tab",
              { y: 18, opacity: 0, duration: 0.55, stagger: 0.08 },
              "-=0.3",
            )
            .from(".divider", { opacity: 0, duration: 0.4 }, "-=0.35")
            .from(".form-note", { y: 12, opacity: 0, duration: 0.5 }, "-=0.3");

          /* Bloom parallax */
          gsap.to(".auth-bloom", {
            yPercent: 30,
            opacity: 0.5,
            ease: "none",
            scrollTrigger: {
              trigger: ".auth-page",
              start: "top top",
              end: "bottom top",
              scrub: true,
            },
          });
        }

        if (reduceMotion) return;

        window.addEventListener("load", () => ScrollTrigger.refresh());
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => ScrollTrigger.refresh());
        }

        /* ══════════════════════════════════════════════════════
     PASSWORD VISIBILITY TOGGLE
     ══════════════════════════════════════════════════════ */
        const pwToggle = document.getElementById("pwToggle");
        const pwInput = document.getElementById("password");
        const pwShow = document.getElementById("pwIconShow");
        const pwHide = document.getElementById("pwIconHide");

        if (pwToggle && pwInput) {
          pwToggle.addEventListener("click", () => {
            const isPassword = pwInput.type === "password";
            pwInput.type = isPassword ? "text" : "password";
            if (pwShow && pwHide) {
              pwShow.style.display = isPassword ? "none" : "block";
              pwHide.style.display = isPassword ? "block" : "none";
            }
            pwToggle.setAttribute(
              "aria-label",
              isPassword ? "Hide password" : "Show password",
            );
          });
        }

        /* ══════════════════════════════════════════════════════
     FORM VALIDATION + ROLE-BASED REDIRECT
     ══════════════════════════════════════════════════════ */
        const form = document.getElementById("loginForm");
        const emailField = document.getElementById("fieldEmail");
        const passField = document.getElementById("fieldPassword");
        const roleGroup = document.getElementById("roleGroup");
        const roleError = document.getElementById("roleError");
        const emailInput = document.getElementById("email");
        const roleInputs = form ? form.querySelectorAll("[data-role]") : [];

        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

        function setFieldError(field, msg) {
          if (!field) return;
          field.classList.add("has-error");
          const box = field.querySelector(".field-error");
          if (box) box.textContent = msg;
          if (!field.dataset.shaken) {
            field.classList.remove("shake");
            void field.offsetWidth;
            field.classList.add("shake");
            field.dataset.shaken = "1";
          }
        }
        function clearFieldError(field) {
          if (!field) return;
          field.classList.remove("has-error", "shake");
          delete field.dataset.shaken;
          const box = field.querySelector(".field-error");
          if (box) box.textContent = "";
        }
        function setRoleError(msg) {
          if (!roleGroup) return;
          roleGroup.classList.add("has-error");
          if (roleError) {
            roleError.textContent = msg;
            roleError.classList.add("is-visible");
          }
        }
        function clearRoleError() {
          if (!roleGroup) return;
          roleGroup.classList.remove("has-error");
          if (roleError) {
            roleError.textContent = "";
            roleError.classList.remove("is-visible");
          }
        }

        if (emailInput) {
          emailInput.addEventListener("input", () => {
            if (emailField.classList.contains("has-error"))
              clearFieldError(emailField);
          });
        }
        if (pwInput) {
          pwInput.addEventListener("input", () => {
            if (passField.classList.contains("has-error"))
              clearFieldError(passField);
          });
        }
        roleInputs.forEach((r) => {
          r.addEventListener("change", clearRoleError);
        });

        if (form) {
          form.addEventListener("submit", (e) => {
            e.preventDefault();

            let valid = true;

            /* Email */
            const emailVal = emailInput.value.trim();
            if (emailVal === "") {
              setFieldError(emailField, "Please enter your email address");
              valid = false;
            } else if (!EMAIL_RE.test(emailVal)) {
              setFieldError(emailField, "Please enter a valid email address");
              valid = false;
            } else {
              clearFieldError(emailField);
            }

            /* Password */
            const pwVal = pwInput.value.trim();
            if (pwVal === "") {
              setFieldError(passField, "Please enter your password");
              valid = false;
            } else {
              clearFieldError(passField);
            }

            /* Role */
            let selectedRole = null;
            roleInputs.forEach((r) => {
              if (r.checked) selectedRole = r.value;
            });
            if (!selectedRole) {
              setRoleError("Please select your role to continue");
              valid = false;
            } else {
              clearRoleError();
            }

            if (!valid) {
              const firstBad = form.querySelector(
                ".form-field.has-error .form-input",
              );
              if (firstBad && firstBad.focus)
                firstBad.focus({ preventScroll: true });
              return;
            }

            /* Store locally */
            try {
              localStorage.setItem("stackly_user_email", emailVal);
              localStorage.setItem("stackly_user_role", selectedRole);
              localStorage.setItem("stackly_user_signed_in", "1");
              localStorage.setItem(
                "stackly_user_signed_in_at",
                new Date().toISOString(),
              );
            } catch (err) {
              console.warn("localStorage unavailable:", err);
            }

            /* Redirect by role */
            window.location.href =
              selectedRole === "admin" ? "./admin.html" : "./user.html";
          });
        }
      })();
    </script>
  </body>
</html>
