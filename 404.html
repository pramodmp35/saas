<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page not found · Stackly</title>
    <meta
      name="description"
      content="The page you're looking for doesn't exist."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lime: {
                DEFAULT: "#63fd02",
                400: "#8bff3d",
                500: "#63fd02",
                600: "#4fd100",
                700: "#3b9c00",
              },
              ink: {
                DEFAULT: "#010101",
                900: "#050505",
                800: "#0a0a0a",
                700: "#111111",
                600: "#1a1a1a",
              },
              snow: "#fbfcfc",
              fire: "#ff5722",
            },
            fontFamily: {
              display: ['"Space Grotesk"', "system-ui", "sans-serif"],
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --lime: #63fd02;
        --lime-hi: #8bff3d;
        --lime-lo: #4fd100;
        --ink: #010101;
        --red: #ff4d4d;
        --fire: #ff5722;
        --chamfer: 16px;
      }
      @media (min-width: 640px) {
        :root {
          --chamfer: 22px;
        }
      }
      @media (min-width: 1024px) {
        :root {
          --chamfer: 26px;
        }
      }

      *,
      *::before,
      *::after {
        border-radius: 0 !important;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }
      body {
        background:
          radial-gradient(
            1200px 600px at 50% -10%,
            rgba(99, 253, 2, 0.06),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at 100% 40%,
            rgba(99, 253, 2, 0.03),
            transparent 65%
          ),
          linear-gradient(180deg, #010101 0%, #050505 60%, #010101 100%);
        background-attachment: fixed;
        color: #fbfcfc;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::selection {
        background: var(--lime);
        color: var(--ink);
      }

      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        z-index: 9999;
        background: linear-gradient(
          90deg,
          var(--lime) 0%,
          var(--lime-hi) 50%,
          var(--lime) 100%
        );
        transform-origin: 0% 50%;
        transform: scaleX(0);
        box-shadow:
          0 0 14px rgba(99, 253, 2, 0.7),
          0 0 30px rgba(99, 253, 2, 0.4);
        pointer-events: none;
      }

      /* ── Buttons ──────────────────────────────────────────── */
      .btn-tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 0.95rem 1.7rem;
        font-weight: 700;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
        isolation: isolate;
        overflow: hidden;
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
        transition:
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.35s ease,
          color 0.45s ease 0.08s,
          text-shadow 0.45s ease 0.08s;
        will-change: transform;
        white-space: nowrap;
      }
      @media (min-width: 640px) {
        .btn-tab {
          padding: 1.1rem 2.1rem;
          font-size: 0.86rem;
        }
      }
      .btn-tab:hover {
        transform: translateY(-2px);
      }
      .btn-tab:active {
        transform: translateY(0);
      }

      .btn-tab::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        transform: scaleX(0);
        transform-origin: 50% 50%;
        transition: transform 0.55s cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform;
      }

      .btn-tab--lime {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 45%,
          var(--lime-lo) 100%
        );
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 -2px 0 rgba(0, 0, 0, 0.18);
        filter: drop-shadow(0 8px 18px rgba(99, 253, 2, 0.35));
      }
      .btn-tab--lime::before {
        background: linear-gradient(
          180deg,
          #1e1e1e 0%,
          #0a0a0a 55%,
          #020202 100%
        );
      }
      .btn-tab--lime:hover {
        color: var(--lime);
        text-shadow: 0 0 14px rgba(99, 253, 2, 0.55);
        filter: drop-shadow(0 12px 26px rgba(99, 253, 2, 0.55));
      }
      .btn-tab--lime:hover::before {
        transform: scaleX(1);
      }

      .btn-tab--dark {
        background: linear-gradient(
          180deg,
          #2b2b2b 0%,
          #181818 50%,
          #0d0d0d 100%
        );
        color: #fbfcfc;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -2px 0 rgba(0, 0, 0, 0.7);
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.6));
      }
      .btn-tab--dark::before {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
      }
      .btn-tab--dark:hover {
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        filter: drop-shadow(0 12px 26px rgba(99, 253, 2, 0.5));
      }
      .btn-tab--dark:hover::before {
        transform: scaleX(1);
      }
      .btn-tab--dark:hover .arrow {
        transform: translateX(-3px);
      }
      .btn-tab--lime:hover .arrow {
        transform: translateX(3px);
      }
      .btn-tab .arrow {
        transition: transform 0.3s ease;
      }

      .btn-tab--ghost {
        background: rgba(10, 10, 10, 0.55);
        color: #fbfcfc;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        border-left: 1px solid rgba(255, 255, 255, 0.05);
        border-right: 1px solid rgba(0, 0, 0, 0.6);
        border-bottom: 1px solid rgba(0, 0, 0, 0.85);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 12px 30px -14px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      .btn-tab--ghost::before {
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
      }
      .btn-tab--ghost:hover {
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        border-top-color: rgba(99, 253, 2, 0.55);
      }
      .btn-tab--ghost:hover::before {
        transform: scaleX(1);
      }
      .btn-tab--ghost:hover .arrow {
        transform: translateX(-3px);
      }

      /* ── Layout ───────────────────────────────────────────── */
      .error-page {
        position: relative;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.15rem;
        overflow: hidden;
      }
      @media (min-width: 640px) {
        .error-page {
          padding: 3rem 2rem;
        }
      }

      .err-bloom {
        position: absolute;
        top: -160px;
        left: 50%;
        transform: translateX(-50%);
        width: min(900px, 160vw);
        height: 560px;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(99, 253, 2, 0.18),
          transparent 65%
        );
        filter: blur(70px);
        will-change: transform, opacity;
      }
      .err-grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.3;
        z-index: 0;
        background-image:
          linear-gradient(rgba(251, 252, 252, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(251, 252, 252, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(
          ellipse 80% 70% at 50% 40%,
          #000 20%,
          transparent 80%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 80% 70% at 50% 40%,
          #000 20%,
          transparent 80%
        );
      }

      .err-shell {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 52rem;
        overflow: hidden;
        background: linear-gradient(180deg, #131313 0%, #080808 100%);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-left: 1px solid rgba(255, 255, 255, 0.04);
        border-right: 1px solid rgba(0, 0, 0, 0.9);
        border-bottom: 1px solid rgba(0, 0, 0, 0.98);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 50px 110px -50px rgba(0, 0, 0, 0.95);
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
        isolation: isolate;
        padding: 2.4rem 1.6rem 2.6rem;
        text-align: center;
      }
      @media (min-width: 640px) {
        .err-shell {
          padding: 3.4rem 3rem 3.6rem;
        }
      }
      @media (min-width: 1024px) {
        .err-shell {
          padding: 4rem 3.6rem 4.2rem;
        }
      }

      .err-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.4;
        background: repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 0px,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 3px
        );
        z-index: 0;
      }

      .err-shell > * {
        position: relative;
        z-index: 1;
      }

      /* ── Tag ──────────────────────────────────────────────── */
      .sk-tag {
        display: inline-block;
        padding: 0.5rem 1rem 0.5rem calc(var(--chamfer) + 0.3rem);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: linear-gradient(180deg, #1e1e1e 0%, #0d0d0d 100%);
        color: var(--lime);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        border-bottom: 1px solid rgba(0, 0, 0, 0.9);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 6px 14px -8px rgba(0, 0, 0, 0.9);
        clip-path: polygon(
          var(--chamfer) 0,
          100% 0,
          100% 100%,
          0 100%,
          0 var(--chamfer)
        );
      }
      .sk-tag::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 0.6rem;
        background: var(--lime);
        vertical-align: middle;
        box-shadow: 0 0 10px var(--lime);
        transform: translateY(-1px);
      }

      /* ── The big 404 numbers ─────────────────────────────── */
      .err-code {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.35rem;
        margin: 1.4rem 0 0.8rem;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 4.4rem;
        line-height: 0.9;
        letter-spacing: -0.06em;
        user-select: none;
      }
      @media (min-width: 640px) {
        .err-code {
          font-size: 6rem;
          gap: 0.5rem;
          margin: 1.6rem 0 1rem;
        }
      }
      @media (min-width: 1024px) {
        .err-code {
          font-size: 7.5rem;
          gap: 0.7rem;
        }
      }

      .err-code span {
        display: inline-block;
        color: #fbfcfc;
        text-shadow:
          0 3px 0 rgba(0, 0, 0, 0.7),
          0 0 40px rgba(99, 253, 2, 0.15);
        will-change: transform;
      }
      .err-code span.err-zero {
        color: var(--lime);
        text-shadow:
          0 3px 0 rgba(0, 0, 0, 0.7),
          0 0 40px rgba(99, 253, 2, 0.65),
          0 0 80px rgba(99, 253, 2, 0.35);
      }
      /* Glitchy layered ::after on the middle zero */
      .err-zero {
        position: relative;
      }
      .err-zero::before,
      .err-zero::after {
        content: "0";
        position: absolute;
        inset: 0;
        color: var(--lime);
        pointer-events: none;
      }
      .err-zero::before {
        color: #ff7a45;
        opacity: 0.35;
        transform: translate(1px, -1px);
        mix-blend-mode: screen;
      }
      .err-zero::after {
        color: #63fd02;
        opacity: 0.35;
        transform: translate(-1px, 1px);
        mix-blend-mode: screen;
      }

      /* ── Headings ─────────────────────────────────────────── */
      .err-title {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        line-height: 1.15;
        color: #fbfcfc;
        margin-top: 1rem;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
      }
      @media (min-width: 640px) {
        .err-title {
          font-size: 1.95rem;
        }
      }
      @media (min-width: 1024px) {
        .err-title {
          font-size: 2.2rem;
        }
      }

      .err-text {
        font-size: 0.94rem;
        line-height: 1.7;
        color: rgba(251, 252, 252, 0.55);
        margin-top: 1rem;
        max-width: 34rem;
        margin-left: auto;
        margin-right: auto;
      }
      @media (min-width: 640px) {
        .err-text {
          font-size: 1rem;
        }
      }

      /* ── Action buttons row ───────────────────────────────── */
      .err-actions {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        justify-content: center;
        align-items: stretch;
        margin-top: 2rem;
      }
      @media (min-width: 520px) {
        .err-actions {
          flex-direction: row;
          align-items: center;
          gap: 1rem;
        }
      }

      /* ── Small "helpful links" row ────────────────────────── */
      .err-help {
        margin-top: 2.2rem;
        padding-top: 1.8rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .err-help-label {
        font-size: 0.68rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(251, 252, 252, 0.35);
        font-weight: 700;
        margin-bottom: 1rem;
      }
      .err-help-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.5rem 0.8rem;
      }
      .err-link {
        font-size: 0.8rem;
        color: rgba(251, 252, 252, 0.55);
        text-decoration: none;
        padding: 0.35rem 0.75rem;
        background: linear-gradient(180deg, #141414 0%, #080808 100%);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(0, 0, 0, 0.9);
        transition:
          color 0.25s ease,
          border-color 0.25s ease,
          transform 0.25s ease;
      }
      .err-link:hover {
        color: var(--lime);
        border-top-color: rgba(99, 253, 2, 0.4);
        transform: translateY(-1px);
      }

      /* ── Decorative floating diamonds ─────────────────────── */
      .err-float {
        position: absolute;
        width: 14px;
        height: 14px;
        background: linear-gradient(
          180deg,
          var(--lime-hi) 0%,
          var(--lime) 50%,
          var(--lime-lo) 100%
        );
        transform: rotate(45deg);
        box-shadow: 0 0 24px rgba(99, 253, 2, 0.6);
        opacity: 0.35;
        pointer-events: none;
        z-index: 1;
      }
      .err-float.f1 {
        top: 12%;
        left: 8%;
      }
      .err-float.f2 {
        top: 18%;
        right: 10%;
        width: 10px;
        height: 10px;
        opacity: 0.25;
      }
      .err-float.f3 {
        bottom: 14%;
        left: 12%;
        width: 12px;
        height: 12px;
        opacity: 0.3;
      }
      .err-float.f4 {
        bottom: 20%;
        right: 14%;
        width: 8px;
        height: 8px;
        opacity: 0.2;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .btn-tab::before {
          transition: none !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="scroll-progress" aria-hidden="true"></div>

    <main class="error-page">
      <div class="err-bloom" aria-hidden="true"></div>
      <div class="err-grid" aria-hidden="true"></div>
      <div class="err-float f1" aria-hidden="true"></div>
      <div class="err-float f2" aria-hidden="true"></div>
      <div class="err-float f3" aria-hidden="true"></div>
      <div class="err-float f4" aria-hidden="true"></div>

      <div class="err-shell err-shell-el">
        <span class="sk-tag err-tag">Error 404 · Page not found</span>

        <h1 class="err-code" aria-label="404">
          <span class="err-digit">4</span>
          <span class="err-digit err-zero">0</span>
          <span class="err-digit">4</span>
        </h1>

        <h2 class="err-title">This page took a wrong turn.</h2>

        <p class="err-text">
          The page you're looking for has been moved, deleted, or never existed
          in the first place. Let's get you back to somewhere real.
        </p>

        <div class="err-actions">
          <button type="button" class="btn-tab btn-tab--dark" id="goBackBtn">
            <svg
              class="arrow"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Go back
          </button>

          <a href="index.html" class="btn-tab btn-tab--lime">
            Go to home
            <svg
              class="arrow"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>

        <div class="err-help">
          <p class="err-help-label">Or try one of these</p>
          <div class="err-help-links">
            <a href="products.html" class="err-link">Products</a>
            <a href="pricing.html" class="err-link">Pricing</a>
            <a href="blog.html" class="err-link">Blog</a>
            <a href="about.html" class="err-link">About</a>
            <a href="contact.html" class="err-link">Contact</a>
            <a href="login.html" class="err-link">Sign in</a>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <script>
      (function () {
        "use strict";

        if (window.gsap && window.ScrollTrigger)
          gsap.registerPlugin(ScrollTrigger);
        var reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        /* ── Scroll progress bar (still works if page ever scrolls) ── */
        var progressBar = document.querySelector(".scroll-progress");
        if (progressBar && !reduceMotion) {
          gsap.to(progressBar, {
            scaleX: 1,
            ease: "none",
            scrollTrigger: {
              trigger: document.documentElement,
              start: "top top",
              end: "bottom bottom",
              scrub: 0.2,
            },
          });
        }

        /* ── Entry timeline ─────────────────────────────────── */
        if (!reduceMotion) {
          var tl = gsap.timeline({
            delay: 0.15,
            defaults: { ease: "power4.out" },
          });

          tl.fromTo(
            ".err-shell-el",
            { clipPath: "inset(0 0 100% 0)", y: 40, opacity: 0 },
            { clipPath: "inset(0 0 0% 0)", y: 0, opacity: 1, duration: 1.05 },
          )
            .from(".err-tag", { y: 14, opacity: 0, duration: 0.55 }, "-=0.7")
            .from(
              ".err-digit",
              {
                y: 80,
                opacity: 0,
                rotate: -8,
                duration: 0.85,
                stagger: 0.09,
              },
              "-=0.45",
            )
            .from(".err-title", { y: 22, opacity: 0, duration: 0.6 }, "-=0.55")
            .from(".err-text", { y: 20, opacity: 0, duration: 0.6 }, "-=0.45")
            .from(
              ".err-actions .btn-tab",
              {
                y: 20,
                opacity: 0,
                duration: 0.6,
                stagger: 0.1,
              },
              "-=0.4",
            )
            .from(
              ".err-help-label",
              { opacity: 0, y: 8, duration: 0.4 },
              "-=0.35",
            )
            .from(
              ".err-link",
              {
                y: 14,
                opacity: 0,
                duration: 0.45,
                stagger: 0.045,
              },
              "-=0.3",
            );

          /* Floating diamonds drift continuously */
          gsap.to(".f1", {
            y: -14,
            duration: 2.4,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
          });
          gsap.to(".f2", {
            y: 12,
            duration: 2.8,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
            delay: 0.3,
          });
          gsap.to(".f3", {
            y: -10,
            duration: 2.1,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
            delay: 0.6,
          });
          gsap.to(".f4", {
            y: 8,
            duration: 3.1,
            repeat: -1,
            yoyo: true,
            ease: "sine.inOut",
            delay: 0.9,
          });

          /* Bloom parallax on scroll */
          gsap.to(".err-bloom", {
            yPercent: 30,
            opacity: 0.55,
            ease: "none",
            scrollTrigger: {
              trigger: ".error-page",
              start: "top top",
              end: "bottom top",
              scrub: true,
            },
          });

          /* Blinking glitch on the middle zero */
          var zero = document.querySelector(".err-zero");
          if (zero) {
            gsap.to(zero, {
              opacity: 0.82,
              duration: 0.14,
              repeat: -1,
              yoyo: true,
              repeatDelay: 1.8,
              ease: "steps(2)",
            });
          }
        }

        /* ── GO BACK button ─────────────────────────────────── */
        var goBackBtn = document.getElementById("goBackBtn");
        if (goBackBtn) {
          goBackBtn.addEventListener("click", function () {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = "./index.html";
            }
          });
        }
      })();
    </script>
  </body>
</html>
